<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RPG Battle Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1>Welcome to RPG Battle!</h1>
    <button id="start-btn">Start Game</button>
  </div>
  <!-- Game Screen -->
  <div id="game-screen" style="display:none;">
    <div id="battle-area">
      <div id="player-stats">
        <h2>Player</h2>
        <p id="player-hp">HP: 100</p>
      </div>
      <div id="monster-stats">
        <h2 id="monster-name">Monster</h2>
        <p id="monster-hp">HP: 100</p>
      </div>
    </div>
    <!-- Action Buttons -->
    <div id="actions">
      <button id="attack-btn"><img src="attack-btn.png" alt="Attack" /></button>
      <button id="block-btn"><img src="block-btn.png" alt="Block" /></button>
    </div>
    <!-- Battle Log -->
    <div id="log"></div>
  </div>
  <!-- Win Screen -->
  <div id="win-screen" style="display:none;">
    <h1>You Win!</h1>
    <p>You defeated all the monsters!</p>
  </div>
  <!-- Lose Screen -->
  <div id="lose-screen" style="display:none;">
    <h1>Game Over</h1>
    <p>You were defeated in battle.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
